<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #5b2a45;
    --plum-dark: #3f1c31;
    --pink: #f3d7dd;
    --pink-soft: #fbeef1;
    --gold: #c8a15a;
    --cream: #fdf8f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(180deg, #fdf8f3 0%, #f7e9ee 60%, #f3dde6 100%);
    color: var(--plum-dark);
    display: flex;
    justify-content: center;
    padding: 0 0 60px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    background: var(--cream);
    box-shadow: 0 10px 40px rgba(91, 42, 69, 0.15);
    min-height: 100vh;
  }
  .banner {
    width: 100%;
    display: block;
  }
  .content {
    padding: 28px 22px 10px;
  }
  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    text-align: center;
    color: var(--plum);
    margin: 0 0 6px;
    letter-spacing: 0.03em;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8a5a6f;
    margin-bottom: 22px;
  }
  .info-card {
    background: linear-gradient(135deg, #fff 0%, var(--pink-soft) 100%);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 26px;
    font-size: 13.5px;
    line-height: 1.9;
  }
  .info-card b {
    color: var(--plum);
    display: inline-block;
    width: 4.5em;
  }
  label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--plum);
    margin: 18px 0 6px;
  }
  .req {
    color: #c46a86;
    font-size: 11px;
    font-weight: 500;
    margin-left: 4px;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e3c3ce;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    color: var(--plum-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus {
    border-color: var(--gold);
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  .pay-options {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .pay-option {
    flex: 1;
    position: relative;
  }
  .pay-option input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .pay-option span {
    display: block;
    text-align: center;
    padding: 12px 10px;
    border: 1.5px solid #e3c3ce;
    border-radius: 12px;
    background: #fff;
    font-size: 14px;
    font-weight: 700;
    color: #8a5a6f;
    transition: all 0.2s;
  }
  .pay-option input:checked + span {
    border-color: var(--gold);
    background: linear-gradient(135deg, #fff 0%, var(--pink-soft) 100%);
    color: var(--plum);
    box-shadow: 0 4px 12px rgba(200, 161, 90, 0.3);
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 22px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #6b4456;
  }
  .checkbox-row input {
    margin-top: 3px;
    flex-shrink: 0;
  }
  button#submitBtn {
    width: 100%;
    margin-top: 26px;
    padding: 15px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--plum) 0%, #7a3a5c 100%);
    color: #fdf3f6;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-family: 'Noto Serif JP', serif;
    box-shadow: 0 8px 20px rgba(91, 42, 69, 0.35);
    cursor: pointer;
  }
  button#submitBtn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .error-msg {
    color: #b3304f;
    font-size: 12.5px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #a97e91;
    margin-top: 18px;
  }
  /* 送信完了画面 */
  .done-screen {
    display: none;
    padding: 60px 26px 40px;
    text-align: center;
  }
  .done-screen .moon {
    font-size: 40px;
  }
  .done-screen h2 {
    font-family: 'Noto Serif JP', serif;
    color: var(--plum);
    font-size: 20px;
    margin: 14px 0 10px;
  }
  .done-screen p {
    font-size: 13.5px;
    line-height: 1.9;
    color: #6b4456;
  }
</style>
</head>

  <div class="content" id="formScreen">
    <h1>お申し込みフォーム</h1>
    <div class="sub">〜性とパートナーシップ、本当の望みを話してみよう〜</div>

    <div class="info-card">
      <div><b>日時</b>9月28日（月）21:30〜（約90分）</div>
      <div><b>場所</b>Zoom（お申し込み後にご案内）</div>
      <div><b>対象</b>18歳以上の女性・定員5名</div>
      <div><b>参加費</b>初回お試し価格 500円</div>
    </div>

    <form id="entryForm">
      <label>お名前（ニックネームOK）<span class="req">必須</span></label>
      <input type="text" id="name" required>

      <label>メールアドレス<span class="req">必須</span></label>
      <input type="email" id="email" required>

      <label>お支払い方法<span class="req">必須</span></label>
      <div class="pay-options">
        <label class="pay-option">
          <input type="radio" name="paymentMethod" value="振込" required>
          <span>振込</span>
        </label>
        <label class="pay-option">
          <input type="radio" name="paymentMethod" value="PayPay">
          <span>PayPay</span>
        </label>
      </div>

      <label>参加にあたって一言・聞いてみたいことなど（任意）</label>
      <textarea id="message" placeholder="例）はじめての参加でドキドキしています…"></textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="agree" required>
        <label for="agree" style="margin:0;font-weight:400;color:inherit;">
          録画・録音・スクショなし、お互いの気持ちや望みを否定しないという
          当日のグランドルールに同意します
        </label>
      </div>

      <button type="submit" id="submitBtn">この内容で申し込む</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="footer-note">送信後、ご登録のメールアドレスに確認メールが届きます</div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="moon">🌙</div>
    <h2>お申し込みありがとうございます</h2>
    <p>
      ご登録のメールアドレスに確認メールをお送りしました。<br><br>
      当日Zoomでお会いできるのを、あきも楽しみにしています☺️💕
    </p>
  </div>

</div>

<script>
  document.getElementById('entryForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var message = document.getElementById('message').value.trim();
    var paymentEl = document.querySelector('input[name="paymentMethod"]:checked');
    var paymentMethod = paymentEl ? paymentEl.value : '';
    var agree = document.getElementById('agree').checked;
    var errorMsg = document.getElementById('errorMsg');
    var btn = document.getElementById('submitBtn');

    errorMsg.style.display = 'none';

    if (!name || !email) {
      errorMsg.textContent = 'お名前とメールアドレスをご入力ください。';
      errorMsg.style.display = 'block';
      return;
    }
    if (!paymentMethod) {
      errorMsg.textContent = 'お支払い方法を選択してください。';
      errorMsg.style.display = 'block';
      return;
    }
    if (!agree) {
      errorMsg.textContent = 'グランドルールへの同意にチェックをお願いします。';
      errorMsg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '送信中…';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          document.getElementById('formScreen').style.display = 'none';
          document.getElementById('doneScreen').style.display = 'block';
        } else {
          errorMsg.textContent = res.error || '送信に失敗しました。時間をおいてお試しください。';
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'この内容で申し込む';
        }
      })
      .withFailureHandler(function (err) {
        errorMsg.textContent = '送信エラー：' + err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'この内容で申し込む';
      })
      .submitForm({ name: name, email: email, paymentMethod: paymentMethod, message: message });
  });
</script>
